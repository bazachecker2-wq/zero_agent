<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionDrone</title><style>
:root{color-scheme:dark}body{margin:0;background:#07090d;color:#eef1f6;font:14px system-ui,-apple-system,sans-serif}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;height:100vh;padding:12px;box-sizing:border-box}.panel{background:#10141b;border:1px solid #242b36;border-radius:14px;overflow:hidden}.video{position:relative;height:100%;min-height:320px;display:grid;place-items:center;background:#05070a}.video video{width:100%;height:100%;object-fit:cover}.empty{position:absolute;text-align:center;color:#7f8997}.bar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #242b36}.button{border:1px solid #303946;background:#171d26;color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.dot{width:8px;height:8px;border-radius:50%;background:#55d88a}.side{padding:14px;display:flex;flex-direction:column;gap:12px}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #202630}.log{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#aeb7c4;overflow:auto;max-height:50vh}.title{font-weight:700}.muted{color:#7f8997}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}.panel.video{height:60vh}.side{min-height:300px}}
</style></head><body><main><section class="panel"><div class="bar"><span class="dot"></span><span class="title">VisionDrone · LIVE</span><span class="muted" id="status">offline</span><span style="margin-left:auto"><button class="button" id="camera">Камера</button></span></div><div class="video"><video id="preview" autoplay muted playsinline></video><div class="empty" id="empty">Нажми «Камера», чтобы дать браузеру видеопоток.<br>LiveKit подключение добавляется через frontend token endpoint.</div></div></section><aside class="panel side"><div><div class="title">Telemetry</div><div class="stat"><span>GPS</span><b id="gps">—</b></div><div class="stat"><span>Altitude</span><b id="alt">—</b></div><div class="stat"><span>Heading</span><b id="heading">—</b></div><div class="stat"><span>Speed</span><b id="speed">—</b></div><div class="stat"><span>Battery</span><b id="battery">—</b></div></div><div><div class="title">Live log</div><div class="log" id="log">waiting…</div></div></aside></main><script>
const q=s=>document.querySelector(s);q('#camera').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:true});q('#preview').srcObject=stream;q('#empty').style.display='none';q('#status').textContent='camera ready'}catch(e){q('#status').textContent='camera denied'}};
async function poll(){try{const [t,e]=await Promise.all([fetch('/api/telemetry'),fetch('/api/events?limit=25')]);const x=await t.json(), ev=await e.json();q('#gps').textContent=x.latitude!=null?`${x.latitude.toFixed(5)}, ${x.longitude.toFixed(5)}`:'—';q('#alt').textContent=x.altitude_m!=null?`${x.altitude_m.toFixed(1)} m`:'—';q('#heading').textContent=x.heading_deg!=null?`${x.heading_deg.toFixed(0)}°`:'—';q('#speed').textContent=x.velocity_mps!=null?`${x.velocity_mps.toFixed(1)} m/s`:'—';q('#battery').textContent=x.battery_pct!=null?`${x.battery_pct.toFixed(0)}%`:'—';q('#log').textContent=ev.map(v=>`[${v.kind}] ${v.ts}\n${JSON.stringify(v.payload)}`).join('\n\n')||'waiting…'}catch(e){}}setInterval(poll,1000);poll();
</script></body></html>
